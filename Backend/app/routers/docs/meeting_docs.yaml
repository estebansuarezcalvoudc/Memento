# Meeting Router Documentation
# This file contains all documentation for meeting-related endpoints

# Form field descriptions (shared across endpoints)
form_descriptions:
  meetings_metadata: "JSON object containing meetings_metadata array and optional processing_configuration. Copy and paste the example from the endpoint description above."
  audios: "Audio files corresponding to each meeting"

# Form field examples (shared across endpoints)
form_examples:
  meetings_metadata: |
    {
      "meetings_metadata": [
        {
          "title": "Team Standup",
          "date": "2025-07-15",
          "language": "en",
          "number_of_speakers": 3
        },
        {
          "title": "Project Review",
          "date": "2025-07-16",
          "language": "en",
          "number_of_speakers": 2
        }
      ],
      "processing_configuration": {
        "language_model": "llama3.2",
        "prompt": "Custom prompt for summarization",
        "options": {
          "temperature": 0.2,
          "num_predict": 600
        }
      }
    }

# Endpoint-specific documentation
endpoint_descriptions:
  create_meetings: |
    Create meetings and process them with audio files.

    <b>meetings_data</b> should be a JSON string containing a batch request object with meetings metadata array and optional processing configuration.

    <b>Example:</b>
    <pre>
    {
      "meetings_metadata": [
        {
          "title": "Team Standup",
          "date": "2025-07-15",
          "language": "en",
          "number_of_speakers": 3
        },
        {
          "title": "Project Review", 
          "date": "2025-07-16",
          "language": "en",
          "number_of_speakers": 2
        }
      ],
      "processing_configuration": {
        "language_model": "llama3.2",
        "prompt": "Custom prompt for summarization",
        "options": {
          "temperature": 0.2,
          "num_predict": 600
        }
      }
    }
    </pre>

    <b>Structure:</b>
    - meetings_metadata: Array of meeting objects (required)
    - processing_configuration: Shared configuration for all meetings (optional)

    <b>Meeting metadata fields (per meeting):</b>
    - title: string (required)
    - date: string in YYYY-MM-DD format (required)
    - language: string, e.g., "en", "es" (optional)
    - number_of_speakers: integer (optional)

    <b>Processing configuration fields (applied to all meetings):</b>
    - language_model: string (default: "llama3.2") - Language model for summarization
    - prompt: string - Custom prompt for the language model (optional)
    - options: object - Options for the language model like temperature, num_predict (optional)

  get_meetings: |
    Retrieve all meetings with optional filtering.

    <b>Query Parameters:</b>
    - limit: Maximum number of meetings to return (default: 100)
    - offset: Number of meetings to skip (default: 0)
    - date_from: Filter meetings from this date (YYYY-MM-DD format)
    - date_to: Filter meetings until this date (YYYY-MM-DD format)

# OpenAPI schema configurations for each endpoint
openapi_schemas:
  create_meetings:
    requestBody:
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              meetings_data:
                type: object
                properties:
                  meetings_metadata:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        date:
                          type: string
                          format: date
                        language:
                          type: string
                        number_of_speakers:
                          type: integer
                      required:
                        - title
                        - date
                  processing_configuration:
                    type: object
                    properties:
                      language_model:
                        type: string
                        description: "Language model for summarization"
                        default: "llama3.2"
                      prompt:
                        type: string
                        description: "Custom prompt for the language model"
                      options:
                        type: object
                        description: "Options for the language model"
                        properties:
                          temperature:
                            type: number
                            default: 0.2
                          num_predict:
                            type: integer
                            default: 600
                required:
                  - meetings_metadata
                default:
                  meetings_metadata:
                    - title: "My first meeting"
                      date: "2025-07-15"
                      language: "es"
                      number_of_speakers: 2
                  processing_configuration:
                    language_model: "llama3.2"
                    options:
                      temperature: 0.2
                      num_predict: 600
                description: "Batch request with meetings metadata and processing configuration"
              audios:
                type: array
                items:
                  type: string
                  format: binary
                description: "Audio files corresponding to each meeting"
            required:
              - meetings_data
              - audios
