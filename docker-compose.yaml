services:
  backend:
    build: ./Backend
    ports:
      - "8000:${BACKEND_PORT}"
    volumes:
      - ./Backend:/Backend
      - ./.env.docker:/.env.docker
      - ./Backend/.env.secrets:/Backend/.env.secrets
    runtime: nvidia
    depends_on:
      - ollama
      - mongo_db
      - elastic_search
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - DEBUG=1
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_PORT=${OLLAMA_PORT}
    networks:
      - back_net
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    ports:
      - 8001:${OLLAMA_PORT}
    networks:
      - back_net
    restart: unless-stopped

  mongo_db:
    image: mongodb/mongodb-community-server
    ports:
      - 27017:${MONGO_PORT}
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    networks:
      - back_net
    restart: unless-stopped

  elastic_search:
    image: elasticsearch:9.1.2
    ports:
      - 9200:${ELASTIC_SEARCH_PORT}
    volumes:
      - elastic_search_data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_SEARCH_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    networks:
      - back_net
    restart: unless-stopped

volumes:
  mongodb_data:
  elastic_search_data:

networks:
  back_net:
