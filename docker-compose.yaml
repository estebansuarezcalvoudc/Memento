services:
  backend:
    build: ./Backend
    ports:
      - "${BACKEND_EXTERNAL_PORT}:${BACKEND_INTERNAL_PORT}"
    volumes:
      - ./Backend:/Backend
      - ./.env.docker:/.env.docker
      - ./Backend/.env.secrets:/Backend/.env.secrets
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - DEBUG=1
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_PORT=${OLLAMA_PORT}
    networks:
      - back_net

  database:
    image: postgres
    ports:
      - "${DATABASE_EXTERNAL_PORT}:${DATABASE_INTERNAL_PORT}"
    volumes:
      - database_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=prisma
    networks:
      - back_net

  ollama:
    image: ollama/ollama
    ports:
      - "${OLLAMA_EXTERNAL_PORT}:${OLLAMA_INTERNAL_PORT}"
    networks:
      - back_net

volumes:
  database_data:

networks:
  back_net:
