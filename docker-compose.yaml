services:
  backend:
    build: ./Backend
    ports:
      - "8000:${BACKEND_INTERNAL_PORT}"
    volumes:
      - ./Backend:/Backend
      - ./.env.docker:/.env.docker
      - ./Backend/.env.secrets:/Backend/.env.secrets
    runtime: nvidia
    depends_on:
      - postgres_db
      - mongo_db
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - DEBUG=1
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_PORT=${OLLAMA_PORT}
    networks:
      - back_net
    restart: unless-stopped

  postgres_db:
    image: postgres
    ports:
      - 5432:${POSTGRES_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=prisma
    networks:
      - back_net
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    ports:
      - 8001:${OLLAMA_INTERNAL_PORT}
    networks:
      - back_net
    restart: unless-stopped

  mongo_db:
    image: mongodb/mongodb-community-server
    container_name: mongodb
    ports:
      - 27017:${MONGO_INTERNAL_PORT}
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    networks:
      - back_net
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:

networks:
  back_net:
